
mysql:
  pv:
    storage: 1G
  pvc:
    storage: 1G
  statefulset:
    image:
      name: mysql
      version: 8.0
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 1Gi
    tolerations:
      key: "app"
      operator: "Equal"
      value: "mysql"
      effect: "NoSchedule"
    affinity:
      key: "app"
      operator: In
      value: mysql

  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"